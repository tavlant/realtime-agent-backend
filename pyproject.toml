[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "realtime-agent-backend"
version = "0.2.0"
description = "Production-style FastAPI backend for streaming LLM chat agents: WebSockets, tool calling, Redis + Postgres memory, pgvector RAG."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Taulant Gashi" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "pgvector>=0.3",
    "tzdata>=2024.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
providers = [
    "openai>=1.40",
    "anthropic>=2.0",
]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = [
    "realtime-agent-backend[providers]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis[lua]>=2.23",
    "websockets>=12",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:pgvector.*"]

[tool.coverage.run]
source = ["agent_backend"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "fakeredis.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF", "C4", "PT"]
ignore = ["B008", "RUF012", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT012"]

[tool.ruff.lint.isort]
known-first-party = ["agent_backend"]
